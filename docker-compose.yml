# ros2lab-a / ros2lab-b: 同じイメージから 2 台立ち上げ、コンテナ間の
# ROS 2 Discovery・Pub/Sub を実習する。
x-ros2lab: &ros2lab
  build: .
  image: ros2lab:jazzy
  tty: true
  stdin_open: true
  # default: ホストの実機 ROS グラフとは別ネットワーク名前空間の bridge。
  # lab: 他のラボ用コンテナ（kali-vnc 等）と疎通させるための internal
  #      ネットワーク。インターネットへの出口は持たない。
  # ROS_DOMAIN_ID / ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET は Dockerfile 側で設定済み。
  # SUBNET により同じネットワーク上の ros2lab-a / ros2lab-b / ラボ用コンテナ間で Discovery できる。
  networks:
    - default
    - lab
  volumes:
    - ./workspace:/workspace
  # DDS 実装は Fast DDS（ROS 2 の既定）。SROS2 の挙動は実装ごとに違うため明示しておく。
  environment:
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
  # SROS2 の環境（a: 未適用 / b: 誤設定 / c: 適正）。scripts/up-env.sh が SROS2_ENV を渡す。
  labels:
    ros2poc.env: ${SROS2_ENV:-a}

services:
  ros2lab-a:
    <<: *ros2lab
    container_name: ros2lab-a
    hostname: ros2lab-a
  ros2lab-b:
    <<: *ros2lab
    container_name: ros2lab-b
    hostname: ros2lab-b

  ros2arm:
    # アームシミュ（Gazebo / MoveIt 2 / RViz2）。重いので profile 指定時のみ起動する:
    #   bash scripts/up-arm.sh   （ros2real 起動中は拒否する。docker compose --profile arm up -d --build と同じ）
    profiles: [arm]
    build:
      context: .
      dockerfile: Dockerfile.arm
    container_name: ros2arm
    # SROS2 化していない（常に環境 A）。環境ラベルだけ付ける。
    labels:
      ros2poc.env: a
    # noVNC (6080) とネイティブ VNC (5901)。どちらも LAN には出さずホストのローカルからのみ接続させる。
    # VNC はコンテナ側 5900（Dockerfile.arm の socat ブリッジ）。ホスト側を 5901 にしているのは、
    # macOS の画面共有サーバー（既定 5900）と衝突させないため。
    ports:
      - "127.0.0.1:6080:80"
      - "127.0.0.1:5901:5900"
    # Gazebo / RViz が共有メモリを使うため既定の 64MB では不足する
    shm_size: 512m
    # ROS_DOMAIN_ID / ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET は Dockerfile.arm 側で設定済み。
    # lab 経由で ros2lab と Discovery し、ros2lab をクライアントとして使える。
    networks:
      - default
      - lab
    volumes:
      - ./workspace:/workspace

  ros2real:
    # CRANE-X7 実機ドライバ。Linux ホスト専用（Mac / Colima は USB を渡せない）。
    # ros2arm（シミュ）と同時に起動しない。scripts/up-real.sh 経由で起動すること:
    #   bash scripts/up-real.sh
    # ドライバは手動起動（トルクオンを人が制御する）。README「実機で動かす」参照。
    # restart ポリシーは意図的に付けない（再起動後に勝手にトルクオンさせないため）。
    # 追加しないこと。
    profiles: [real]
    build:
      context: .
      dockerfile: Dockerfile.real
    image: ros2real:jazzy
    container_name: ros2real
    hostname: ros2real
    # SROS2 化していない（常に環境 A）。
    labels:
      ros2poc.env: a
    tty: true
    stdin_open: true
    init: true
    # ホストの udev rule（host/99-crane-x7.rules）が作る symlink を渡す
    devices:
      - /dev/crane_x7:/dev/crane_x7
    # ホストの dialout の GID を数値で渡す（名前だとコンテナ側の /etc/group で解決され、ホストと
    # 食い違うことがある）。Ubuntu / Debian は 20。違うなら DIALOUT_GID=$(getent group dialout | cut -d: -f3)
    group_add:
      - "${DIALOUT_GID:-20}"
    # デバイスを読み書きするだけなので特権は要らない
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # ROS_DOMAIN_ID / ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET は Dockerfile.real 側で設定済み。
    # 意図的に lab (ros2-lab-net) へは繋がない。DDS は無認証で、lab に繋ぐと kali-vnc など
    # 他のラボ用コンテナからも実機に指令できてしまうため。この compose プロジェクトの
    # default ネットワークにいる ros2lab-a/b だけが実機に指令できる。
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./workspace:/workspace

  ros2server:
    # VLA ノード（画像 → /act → /vla/action）と変換ノード（手先差分 → IK → アーム指令）を動かす ROS 2 側のコンテナ。
    # arm 層（ros2arm → 将来 ros2real）は DDS 越しに標準インターフェースで呼ぶだけで、手を入れない。
    # ros2lab-a/b と同じ使い勝手（ROS CLI・./workspace・lab ネットワーク参加）。使い方は docs/openvla-ros2-bridge.md。
    #   docker compose --profile vla up -d --build   （bash scripts/up-arm.sh でシミュを起動したうえで）
    # SROS2 化していない（当面は環境 A。環境ラベルだけ付ける）。
    profiles: [vla]
    build:
      context: .
      dockerfile: Dockerfile.ros2server
    image: ros2server:jazzy
    container_name: ros2server
    hostname: ros2server
    labels:
      ros2poc.env: a
    tty: true
    stdin_open: true
    init: true
    # ROS_DOMAIN_ID / ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET は Dockerfile.ros2server 側で設定済み。
    # lab: ros2arm と同じく ros2-lab-net に参加する。DDS は無認証なので、同じ lab のコンテナ（kali-vnc など）から
    # /vla/action や joint_trajectory を偽装され、シミュ上のアームを動かされうる（docs/openvla-ros2-bridge.md）。
    networks:
      - default
      - lab
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # 既定の VLA サーバー。本物の GPU サーバーに替えるときは VLA_ENDPOINT で上書きする
      - VLA_ENDPOINT=${VLA_ENDPOINT:-http://vla-server:8000/act}
    volumes:
      - ./workspace:/workspace

  vla-server:
    # OpenVLA の REST サーバー（POST /act）の代わりのスタブ。GPU 不要・標準ライブラリだけ。
    # 本物の OpenVLA は別マシンの GPU サーバーに置き、ros2server の VLA_ENDPOINT で指す（docs/openvla-ros2-bridge.md）。
    profiles: [vla]
    build:
      context: .
      dockerfile: Dockerfile.vla-server
    image: vla-server:stub
    container_name: vla-server
    hostname: vla-server
    init: true
    # 外へ出す必要がないものは出さない: default ネットワークだけ（lab には繋がない）、読み取り専用、権限なし
    networks:
      - default
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # ホストへの公開は 127.0.0.1 限定（LAN や 0.0.0.0 に広げない）。ホストのポートが使用中なら VLA_SERVER_PORT で変える
    ports:
      - "127.0.0.1:${VLA_SERVER_PORT:-8000}:8000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ros2diag:
    # SROS2 の診断コンテナ。鍵なし・不正証明書の参加者を作って、各環境の挙動を確認する。
    # scripts/verify-env.sh が使う。ros2-lab-net（internal）だけに接続し、ポートは公開しない。
    # 不正証明書（sros2/rogue、gitignore 済み）はここにだけ read-only で渡し、./workspace は渡さない。
    #   docker compose --profile diag up -d --build ros2diag
    profiles: [diag]
    build:
      context: .
      dockerfile: Dockerfile.diag
    image: ros2diag:jazzy
    container_name: ros2diag
    hostname: ros2diag
    tty: true
    stdin_open: true
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    networks:
      - lab
    volumes:
      - ./sros2/rogue:/sros2/rogue:ro

networks:
  lab:
    # 他の compose プロジェクトから `docker network connect` で参照できるよう固定名にする
    name: ros2-lab-net
    internal: true
