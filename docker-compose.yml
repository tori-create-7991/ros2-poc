# ros2lab-a / ros2lab-b: 同じイメージから 2 台立ち上げ、コンテナ間の
# ROS 2 Discovery・Pub/Sub を実習する。
x-ros2lab: &ros2lab
  build: .
  image: ros2lab:jazzy
  tty: true
  stdin_open: true
  # default: ホストの実機 ROS グラフとは別ネットワーク名前空間の bridge。
  # lab: 他のラボ用コンテナ（kali-vnc 等）と疎通させるための internal
  #      ネットワーク。インターネットへの出口は持たない。
  # ROS_DOMAIN_ID / ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET は Dockerfile 側で設定済み。
  # SUBNET により同じネットワーク上の ros2lab-a / ros2lab-b / ラボ用コンテナ間で Discovery できる。
  networks:
    - default
    - lab
  volumes:
    - ./workspace:/workspace

services:
  ros2lab-a:
    <<: *ros2lab
    container_name: ros2lab-a
    hostname: ros2lab-a
  ros2lab-b:
    <<: *ros2lab
    container_name: ros2lab-b
    hostname: ros2lab-b

  ros2arm:
    # アームシミュ（Gazebo / MoveIt 2 / RViz2）。重いので profile 指定時のみ起動する:
    #   docker compose --profile arm up -d --build
    profiles: [arm]
    build:
      context: .
      dockerfile: Dockerfile.arm
    container_name: ros2arm
    # noVNC。LAN には出さずホストのローカルからのみ接続させる
    ports:
      - "127.0.0.1:6080:80"
    # Gazebo / RViz が共有メモリを使うため既定の 64MB では不足する
    shm_size: 512m
    # ROS_DOMAIN_ID / ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET は Dockerfile.arm 側で設定済み。
    # lab 経由で ros2lab と Discovery し、ros2lab をクライアントとして使える。
    networks:
      - default
      - lab
    volumes:
      - ./workspace:/workspace

  ros2real:
    # CRANE-X7 実機ドライバ。Linux ホスト専用（Mac / Colima は USB を渡せない）。
    # ros2arm（シミュ）と同時に起動しない。scripts/up-real.sh 経由で起動すること:
    #   bash scripts/up-real.sh
    # ドライバは手動起動（トルクオンを人が制御する）。README「実機で動かす」参照。
    profiles: [real]
    build:
      context: .
      dockerfile: Dockerfile.real
    image: ros2real:jazzy
    container_name: ros2real
    hostname: ros2real
    tty: true
    stdin_open: true
    # ホストの udev rule（host/99-crane-x7.rules）が作る symlink を渡す
    devices:
      - /dev/crane_x7:/dev/crane_x7
    group_add:
      - dialout
    # ROS_DOMAIN_ID / ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET は Dockerfile.real 側で設定済み。
    # lab 経由で ros2lab から実機に指令できる。
    networks:
      - default
      - lab
    volumes:
      - ./workspace:/workspace

networks:
  lab:
    # 他の compose プロジェクトから `docker network connect` で参照できるよう固定名にする
    name: ros2-lab-net
    internal: true
