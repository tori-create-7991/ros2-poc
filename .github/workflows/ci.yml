name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/sros2/*.sh scripts/sros2/lib/*.sh sros2/entrypoint.sh
      - name: guard tests (docker stub)
        run: |
          bash scripts/test-up-real.sh
          bash scripts/test-up-env.sh
          bash scripts/test-entrypoint.sh
          bash scripts/test-probe.sh
          bash scripts/test-swap.sh
      - name: SROS2 ledger check
        run: |
          python3 -c 'import yaml' || (sudo apt-get update && sudo apt-get install -y python3-yaml)
          bash scripts/sros2/check-ledger.sh
          bash scripts/sros2/check-ledger.sh --selftest
      - name: python syntax
        run: python3 -m py_compile scripts/sros2/lib/ledger.py scripts/sros2/lib/test_ledger.py sros2/tools/lab_pub.py sros2/tools/lab_sub.py

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.arm
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.real
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.diag
          failure-threshold: error

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config (all profiles)
        run: docker compose --profile "*" config -q
      - name: compose config (SROS2 override, environments b and c)
        run: |
          for e in b c; do
            SROS2_ENV="$e" SROS2_STRATEGY=Enforce docker compose -f docker-compose.yml -f docker-compose.sros2.yml --profile "*" config -q
          done

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no personal paths / private addresses
        run: |
          # コンテナ既定ユーザー /home/ubuntu は公開して問題ないため除外する
          hits=$(git grep -nIE '/Users/[A-Za-z0-9._-]+|/home/[a-z][A-Za-z0-9._-]*/|\b192\.168\.[0-9]+\.[0-9]+|\b10\.[0-9]+\.[0-9]+\.[0-9]+' -- . ':!.github/workflows/ci.yml' ':!AGENTS.md' | grep -v '/home/ubuntu/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::personal path or private address found (repo is PUBLIC)"; exit 1
          fi
      - name: LICENSE and AGENTS.md exist
        run: test -f LICENSE && test -f AGENTS.md
